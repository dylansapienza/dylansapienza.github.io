<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#172a45">
  <title>Three Albums</title>
  <style>
    :root {
      color-scheme: light;
      --background: #eef0f2;
      --paper: #ffffff;
      --ink: #172a45;
      --body: #303a46;
      --muted: #68727d;
      --rule: #d3d8de;
      --button: #172a45;
      --button-text: #ffffff;
      --shadow: 0 20px 60px rgb(23 42 69 / 10%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: var(--background);
      color: var(--body);
      font-family: Georgia, "Times New Roman", Times, serif;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(100%, 34rem);
      padding: clamp(2.25rem, 8vw, 4.5rem);
      background: var(--paper);
      border: 1px solid var(--rule);
      border-top: 0.4rem solid var(--ink);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 1.4rem;
      color: var(--muted);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(2.4rem, 9vw, 4.2rem);
      font-variant-caps: small-caps;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.04;
      text-wrap: balance;
    }

    .rule {
      width: 3rem;
      margin: 2rem auto;
      border: 0;
      border-top: 3px double var(--rule);
    }

    #status {
      margin: 0 auto 1.75rem;
      max-width: 25rem;
      font-size: 1.08rem;
      line-height: 1.65;
    }

    #destination-link {
      display: inline-block;
      padding: 0.85rem 1.2rem;
      background: var(--button);
      color: var(--button-text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.025em;
      text-decoration: none;
    }

    #destination-link[hidden] {
      display: none;
    }

    .privacy {
      margin: 2rem 0 0;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      font-size: 0.8rem;
    }

    .privacy a {
      color: var(--muted);
      text-underline-offset: 0.18em;
    }

    @media (max-width: 36rem) {
      body {
        padding: 0;
        background: var(--paper);
      }

      main {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-right: 0;
        border-bottom: 0;
        border-left: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Three Albums</p>
    <h1>Three albums.<br>One week.</h1>
    <hr class="rule">
    <p id="status">The TestFlight or App Store link will be available here soon.</p>
    <a id="destination-link" hidden>Continue to Three Albums</a>
    <p class="privacy"><a href="../three-albums-privacy/">Privacy Policy</a></p>
  </main>

  <script src="redirect.js"></script>
  <script>
    (() => {
      const configured = window.THREE_ALBUMS_DESTINATION?.trim();

      if (!configured) {
        return;
      }

      try {
        const destination = new URL(configured);
        const allowedHosts = new Set([
          "apps.apple.com",
          "testflight.apple.com",
        ]);

        if (destination.protocol !== "https:" || !allowedHosts.has(destination.hostname)) {
          throw new Error("The configured destination is not an Apple App Store or TestFlight URL.");
        }

        const link = document.querySelector("#destination-link");
        link.href = destination.href;
        link.hidden = false;
        document.querySelector("#status").textContent = "Opening Three Albums…";
        window.location.replace(destination.href);
      } catch (error) {
        console.error(error);
        document.querySelector("#status").textContent =
          "The Three Albums download link is being updated. Please try again shortly.";
      }
    })();
  </script>
</body>
</html>
